services:
  echo:
    image: ghcr.io/mojoaar/echo:${ECHO_TAG:-latest}
    container_name: echo
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    ports:
      - "3100:3000"
    volumes:
      - echo-data:/data
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      APP_URL: ${APP_URL:-https://echo.johansen.foo}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-https://umami.johansen.foo/script.js}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-2dd1b560-7022-49d1-8063-bd3ccc99f21d}

volumes:
  echo-data:
